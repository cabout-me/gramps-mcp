[project]
name = "gramps-skill"
version = "2.0.0"
description = "Agent skill for reading and writing a Gramps Web family tree"
requires-python = ">=3.10"
# No runtime dependencies: the scripts in skills/gramps/scripts/ use only the
# standard library, so the skill runs wherever python3 does.
dependencies = []

[tool.ruff]
exclude = [".git/", "__pycache__/", ".venv/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = ["pre-commit>=4.3.0", "ruff>=0.1.0"]
